<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f0f12">
  <title>Аудио спектрограма</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css?v=12">
</head>
<body>
  <header id="toolbar">
    <button id="btnMic" class="primary" data-i18n="mic">Микрофон</button>
    <label class="btn" for="fileInput" data-i18n="file" data-i18n-title="fileTitle">Файл</label>
    <input type="file" id="fileInput" accept="audio/*,video/*,image/*" hidden>
    <button id="btnRec" class="rec" data-i18n="rec" data-i18n-title="recTitle">Запис</button>
    <button id="btnPause" data-i18n="pause" disabled>Пауза</button>
    <button id="btnSave" data-i18n="saveScreen" data-i18n-title="saveScreenTitle">Запази екран</button>
    <button id="btnSettings" data-i18n="settings" data-i18n-title="settings">Настройки</button>
    <span id="status">Натисни „Микрофон“ или отвори звук или картинка</span>
  </header>

  <section id="settings" hidden>
    <label><span data-i18n="fft">FFT размер</span>
      <select id="setFft">
        <option value="1024">1024</option>
        <option value="2048">2048</option>
        <option value="4096">4096</option>
        <option value="8192">8192</option>
        <option value="16384">16384</option>
      </select>
    </label>
    <label><span data-i18n="scale">Скала</span>
      <select id="setScale">
        <option value="log" data-i18n="scaleLog">Логаритмична</option>
        <option value="lin" data-i18n="scaleLin">Линейна</option>
      </select>
    </label>
    <label><span data-i18n="maxFreq">Макс. честота</span>
      <select id="setMaxFreq">
        <option value="2000">2 kHz</option>
        <option value="4000">4 kHz</option>
        <option value="8000">8 kHz</option>
        <option value="12000">12 kHz</option>
        <option value="16000">16 kHz</option>
        <option value="0" data-i18n="nyquist">Максимум (Nyquist)</option>
      </select>
    </label>
    <label><span data-i18n="colors">Цветове</span>
      <select id="setColormap">
        <option value="magma">Magma</option>
        <option value="inferno">Inferno</option>
        <option value="viridis">Viridis</option>
        <option value="jet">Jet</option>
        <option value="gray" data-i18n="gray">Сиво</option>
      </select>
    </label>
    <label><span data-i18n="imageLen">Дължина на звука от картинка</span>
      <select id="setImageSeconds">
        <option value="0" data-i18n="fitScreen">Колкото екрана</option>
        <option value="3">3 s</option>
        <option value="5">5 s</option>
        <option value="10">10 s</option>
        <option value="20">20 s</option>
      </select>
    </label>
    <label><span><span data-i18n="speed">Скорост</span>: <output id="outSpeed"></output></span>
      <input type="range" id="setSpeed" min="1" max="6" step="1">
    </label>
    <label><span><span data-i18n="min">Минимум</span>: <output id="outMinDb"></output> dB</span>
      <input type="range" id="setMinDb" min="-140" max="-50" step="1">
    </label>
    <label><span><span data-i18n="max">Максимум</span>: <output id="outMaxDb"></output> dB</span>
      <input type="range" id="setMaxDb" min="-80" max="0" step="1">
    </label>
  </section>

  <main>
    <div id="wavePane"><canvas id="wave"></canvas></div>
    <div id="specPane">
      <canvas id="spec"></canvas>
      <canvas id="axis"></canvas>
      <div id="cursor" hidden><span></span></div>
    </div>
  </main>

  <footer>
    <span id="peak">—</span>
    <audio id="player" controls hidden></audio>
    <button id="btnSaveAudio" data-i18n="saveAudio" data-i18n-title="saveAudioTitle" hidden>Запази</button>
    <span id="sr"></span>
    <span id="brand">
      <button id="btnLang" type="button" aria-label="Български" title="Български">
        <svg class="flag flag-bg" viewBox="0 0 15 10" aria-hidden="true"><rect width="15" height="3.34" fill="#fff"/><rect y="3.33" width="15" height="3.34" fill="#00966e"/><rect y="6.66" width="15" height="3.34" fill="#d62612"/></svg>
        <svg class="flag flag-en" viewBox="0 0 60 30" aria-hidden="true"><clipPath id="uj"><path d="M0,0 h60 v30 h-60 z"/></clipPath><rect width="60" height="30" fill="#012169"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#C8102E" stroke-width="4" clip-path="url(#uj)"/><path d="M30,0 V30 M0,15 H60" stroke="#fff" stroke-width="10"/><path d="M30,0 V30 M0,15 H60" stroke="#C8102E" stroke-width="6"/></svg>
      </button>
      <button id="credit" type="button">by Dr. Baysinger</button>
    </span>
  </footer>

  <dialog id="about">
    <h2>About</h2>
    <p>Donate to Dr. Baysinger. He promises to spend it on hookers and beer.</p>
    <p>Дарете на Dr. Baysinger. Той обещава да ги изхарчи за курви и бело.</p>
    <h3>Revolut</h3>
    <button type="button" class="copy" data-copy="revolut.me/georgi09qc">revolut.me/georgi09qc</button>
    <h3>BTC address</h3>
    <button type="button" class="copy" data-copy="bc1qr84akpfry7sjs6759wwq722fyert9apcarpst6">bc1qr84akpfry7sjs6759wwq722fyert9apcarpst6</button>
    <button type="button" class="copy" data-copy="bc1p6hp5q20u9t9upsjt7425wgqdrs0cr8wnnlf9atu24z92pzsnq85q62uc8e">bc1p6hp5q20u9t9upsjt7425wgqdrs0cr8wnnlf9atu24z92pzsnq85q62uc8e</button>
    <button id="aboutOk" type="button" class="primary">OK</button>
  </dialog>

  <script src="app.js?v=10"></script>
</body>
</html>
